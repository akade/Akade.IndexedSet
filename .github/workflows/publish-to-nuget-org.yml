name: Publish to nuget.org

on:
  release:
    types: [published]

jobs:
  build:
    permissions:
      id-token: write
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with: 
        lfs: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
           10.x
           11.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c Release --no-restore /p:ContinuousIntegrationBuild=true  -p:IncludeSymbols=true -p=SymbolPackageFormat=snupkg
    - name: Test
      run: dotnet test -c Release --no-build --verbosity normal
    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: upload
      run: dotnet nuget push ./Akade.IndexedSet/bin/Release/Akade.IndexedSet.*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{steps.login.outputs.NUGET_API_KEY}}
